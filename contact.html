<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯繫我們 - 智流生物科技 (Geniflow Biotech)</title>
    <style>
        :root {
            --primary-color: #0080c6;
            --primary-hover: #0066a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 128, 198, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 24px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 32px 0 24px 0;
        }

        .footer-info {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .footer-info p {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .footer-info .icon {
            margin-right: 8px;
            font-style: normal;
        }

        .footer-info a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>提交技術諮詢</h1>
        <p>請填寫您的需求，我們的工程師團隊將在 24 小時內與您聯繫。</p>
    </div>

    <form id="contactForm" onsubmit="handleMailto(event)">
        <div class="form-group">
            <label for="name">姓名 / Name</label>
            <input type="text" id="name" class="form-control" placeholder="例如：Jenny" required>
        </div>

        <div class="form-group">
            <label for="email">電子郵箱 / Email</label>
            <input type="email" id="email" class="form-control" placeholder="yourname@domain.com" required>
        </div>

        <div class="form-group">
            <label for="details">諮詢需求描述 / Project Details</label>
            <textarea id="details" class="form-control" placeholder="請描述您的技術諮詢或合作需求..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">發送諮詢需求</button>
    </form>

    <div class="divider"></div>

    <div class="footer-info">
        <p><span class="icon">📍</span> <strong>香港公司地址：</strong>Smart-Space 8, Cyberport, Hong Kong</p>
        <p><span class="icon">✉️</span> <strong>官方聯絡郵箱：</strong><a href="mailto:contact@geniflowbio.com">contact@geniflowbio.com</a></p>
    </div>
</div>

<script>
    function handleMailto(event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const details = document.getElementById('details').value.trim();

        const recipient = "contact@geniflowbio.com";
        const subject = encodeURIComponent("【技術諮詢】來自 " + name + " 的需求");
        
        const bodyContent = "姓名 / Name: " + name + "\n" +
                            "電子郵箱 / Email: " + email + "\n\n" +
                            "諮詢需求描述 / Project Details:\n" + details;

        const body = encodeURIComponent(bodyContent);

        // 喚起本地郵件客戶端
        window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
    }
</script>

</body>
</html>
